<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Artwork/Archive | Rafael Yaluff</title>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
        font-family: Arial, sans-serif;
      }

      body {
        background: #ffffff;
        color: #000000;
        padding: 40px 20px 80px;
      }

      .container {
        max-width: 1200px;
        margin: 0 auto;
      }

      .topbar {
        display: flex;
        align-items: center;
        justify-content: space-between;
        margin-bottom: 32px;
      }

      .lang-switch {
        display: flex;
        gap: 0.25rem;
      }

      .lang-switch button {
        border: 1px solid #000000;
        background: #ffffff;
        color: #000000;
        padding: 6px 14px;
        font-size: 0.85rem;
        letter-spacing: 0.06em;
        cursor: pointer;
      }

      .lang-switch button[aria-pressed="true"] {
        background: #000000;
        color: #ffffff;
      }

      .intro {
        max-width: 450px;
        padding: 0 40px;
        margin: 80px auto 80px;
        text-align: center;
      }

      .intro h2 {
        font-size: 0.9rem;
        font-weight: 700;
        letter-spacing: 0.12em;
        text-transform: uppercase;
        margin-bottom: 18px;
      }

      .intro p {
        color: #4b4b4b;
        font-size: 0.9rem;
        font-style: italic;
        line-height: 1.5;
        margin-bottom: 10px;
      }

      .back-link {
        color: #000000;
        text-decoration: none;
        font-size: 0.9rem;
      }

      h1 {
        font-size: clamp(2rem, 4vw, 3rem);
        font-weight: 400;
        letter-spacing: 0.08em;
        margin-bottom: 32px;
      }

      .gallery {
        display: grid;
        grid-template-columns: minmax(0, 600px);
        justify-content: center;
        gap: 90px;
      }

      .artwork img {
        display: block;
        width: 100%;
        height: auto;
        background: #f5f5f5;
        cursor: pointer;
      }

      .artwork-info {
        margin-top: 22px;
        margin-bottom: 12px;
        text-align: center;
      }

      .artwork-info h2 {
        font-size: 0.95rem;
        margin-bottom: 4px;
      }

      .meta,
      .description,
      .empty-state,
      .error-state {
        font-size: 0.9rem;
        line-height: 1.7;
      }

      .meta {
        max-width: 400px;
        margin: 0 auto;
        color: #555555;
      }

      .note {
        max-width: 200px;
        margin: 10px 0 0 auto;
        text-align: right;
        color: #555555;
        font-size: 0.8rem;
        font-style: italic;
        line-height: 1.5;
      }

      .note.strikethrough {
        text-decoration: line-through;
      }

      .description {
        margin-top: 12px;
        margin-bottom: 12px;
        color: #222222;
        font-style: italic;
      }

      .empty-state,
      .error-state {
        color: #555555;
      }

      .lightbox {
        position: fixed;
        inset: 0;
        display: none;
        align-items: center;
        justify-content: center;
        background: rgba(0, 0, 0, 0.8);
        z-index: 999;
        padding: 32px;
      }

      .lightbox.open {
        display: flex;
      }

      .lightbox-content {
        position: relative;
        max-width: min(90vw, 1200px);
        max-height: 90vh;
      }

      .lightbox-content img {
        display: block;
        max-width: 100%;
        max-height: 90vh;
        width: auto;
        height: auto;
        background: #ffffff;
      }

      .lightbox-close {
        position: absolute;
        top: -16px;
        right: -16px;
        width: 36px;
        height: 36px;
        border: none;
        border-radius: 50%;
        background: #ffffff;
        color: #000000;
        font-size: 1.2rem;
        cursor: pointer;
      }

      @media (max-width: 640px) {
        .lightbox {
          padding: 20px;
        }
      }
    </style>
  </head>
  <body>
    <main class="container">
      <div class="topbar">
        <a class="back-link" href="index.html" id="back-link">← Back</a>
        <div class="lang-switch" role="group" aria-label="Language">
          <button type="button" data-lang="en">English</button>
          <button type="button" data-lang="es">Español</button>
        </div>
      </div>
      <h1 id="collection-title"></h1>
      <div id="intro" class="intro"></div>
      <section id="gallery" class="gallery" aria-live="polite"></section>
    </main>

    <div id="lightbox" class="lightbox" aria-hidden="true">
      <div class="lightbox-content">
        <button class="lightbox-close" aria-label="Close image">×</button>
        <img id="lightbox-image" src="" alt="" />
      </div>
    </div>

    <script>
      const gallery = document.getElementById('gallery');
      const intro = document.getElementById('intro');
      const lightbox = document.getElementById('lightbox');
      const lightboxImage = document.getElementById('lightbox-image');
      const collectionId = new URLSearchParams(window.location.search).get('collection');
      const text = {
        en: {
          back: '← Back',
          empty: 'Artwork for this archive will be added soon.',
          notFound: 'Archive section not found.',
          error: 'Unable to load this archive section.'
        },
        es: {
          back: '← Volver',
          empty: 'Pronto se agregarán obras a este archivo.',
          notFound: 'Sección del archivo no encontrada.',
          error: 'No se pudo cargar esta sección del archivo.'
        }
      };

      let collection = null;
      let state = 'loading';
      let lang = 'en';
      try {
        const saved = localStorage.getItem('archive-lang');
        if (saved === 'en' || saved === 'es') lang = saved;
      } catch (e) {}

      const imageUrl = path => path.split('/').map(encodeURIComponent).join('/');

      function message(className, content) {
        const p = document.createElement('p');
        p.className = className;
        p.textContent = content;
        return p;
      }

      function render() {
        document.documentElement.lang = lang;
        document.getElementById('back-link').textContent = text[lang].back;
        document.querySelectorAll('.lang-switch button').forEach(button => {
          button.setAttribute('aria-pressed', String(button.dataset.lang === lang));
        });

        intro.replaceChildren();
        const introText = collection && collection.intro ? collection.intro[lang] : '';
        if (introText) {
          const introTitle = collection.introTitle && collection.introTitle[lang];
          if (introTitle) {
            const heading = document.createElement('h2');
            heading.textContent = introTitle;
            intro.appendChild(heading);
          }
          introText.split('\n\n').forEach(paragraph => {
            const line = document.createElement('p');
            line.textContent = paragraph;
            intro.appendChild(line);
          });
        }
        gallery.replaceChildren();

        if (state === 'error' || state === 'notFound') {
          gallery.appendChild(message('error-state', text[lang][state]));
          return;
        }
        if (!collection) return;
        if (collection.artworks.length === 0) {
          gallery.appendChild(message('empty-state', text[lang].empty));
          return;
        }

        collection.artworks.forEach(artwork => {
          const card = document.createElement('article');
          card.className = 'artwork';

          const image = document.createElement('img');
          image.src = imageUrl(artwork.image);
          image.alt = artwork.title[lang];
          image.addEventListener('click', () => {
            lightboxImage.src = imageUrl(artwork.image);
            lightboxImage.alt = artwork.title[lang];
            lightbox.classList.add('open');
            lightbox.setAttribute('aria-hidden', 'false');
          });
          card.appendChild(image);

          const info = document.createElement('div');
          info.className = 'artwork-info';
          const title = document.createElement('h2');
          title.textContent = artwork.title[lang];
          info.appendChild(title);

          const meta = document.createElement('p');
          meta.className = 'meta';
          meta.textContent = [artwork.medium[lang], artwork.dimensions[lang], artwork.year[lang]]
            .filter(Boolean)
            .join(' | ');
          info.appendChild(meta);

          if (artwork.note && artwork.note[lang]) {
            const note = document.createElement('p');
            note.className = 'note';
            if (artwork.noteStrikethrough && artwork.noteStrikethrough.includes(lang)) {
              note.classList.add('strikethrough');
            }
            const noteText = artwork.note[lang].replace(/\s+/g, ' ').trim();
            const footnoteIndex = noteText.indexOf('*');
            if (footnoteIndex >= 0) {
              note.append(document.createTextNode('\u2020 ' + noteText.slice(0, footnoteIndex).trimEnd()));
              note.append(document.createElement('br'));
              note.append(document.createTextNode(noteText.slice(footnoteIndex)));
            } else {
              note.textContent = '\u2020 ' + noteText;
            }
            info.appendChild(note);
          }

          card.appendChild(info);
          gallery.appendChild(card);
        });
      }

      function closeLightbox() {
        lightbox.classList.remove('open');
        lightbox.setAttribute('aria-hidden', 'true');
        lightboxImage.src = '';
      }

      document.querySelector('.lightbox-close').addEventListener('click', closeLightbox);
      lightbox.addEventListener('click', event => {
        if (event.target === lightbox) closeLightbox();
      });
      document.addEventListener('keydown', event => {
        if (event.key === 'Escape' && lightbox.classList.contains('open')) closeLightbox();
      });

      document.querySelectorAll('.lang-switch button').forEach(button => {
        button.addEventListener('click', () => {
          lang = button.dataset.lang;
          try { localStorage.setItem('archive-lang', lang); } catch (e) {}
          render();
        });
      });

      fetch('artwork-archive.json')
        .then(response => {
          if (!response.ok) throw new Error('Unable to load artwork archive.');
          return response.json();
        })
        .then(data => {
          collection = data.collections[collectionId] || null;
          if (collection) {
            state = 'ready';
            document.title = `${collection.title} | Rafael Yaluff`;
            const heading = document.getElementById('collection-title');
            const match = collection.title.match(/^(.*?)\s+(\d{4}\s*-\s*\d{4})$/);
            if (match) {
              heading.append(match[1], document.createElement('br'), match[2]);
            } else {
              heading.textContent = collection.title;
            }
          } else {
            state = 'notFound';
          }
          render();
        })
        .catch(error => {
          console.error(error);
          state = 'error';
          render();
        });

      render();
    </script>
  </body>
</html>
