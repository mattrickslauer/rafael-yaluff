<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Artwork/Archive | Rafael Yaluff</title>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
        font-family: Arial, sans-serif;
      }

      body {
        background: #ffffff;
        color: #000000;
        padding: 40px 20px 80px;
      }

      .container {
        max-width: 1200px;
        margin: 0 auto;
      }

      .topbar {
        margin-bottom: 32px;
      }

      .back-link {
        color: #000000;
        text-decoration: none;
        font-size: 0.9rem;
      }

      h1 {
        font-size: clamp(2rem, 4vw, 3rem);
        font-weight: 400;
        letter-spacing: 0.08em;
        margin-bottom: 32px;
      }

      .gallery {
        display: grid;
        grid-template-columns: minmax(0, 760px);
        gap: 42px;
      }

      .artwork img {
        display: block;
        width: 100%;
        height: auto;
        background: #f5f5f5;
      }

      .artwork-info {
        margin-top: 16px;
      }

      .artwork-info h2 {
        font-size: 1.1rem;
        margin-bottom: 8px;
      }

      .meta,
      .description,
      .empty-state,
      .error-state {
        font-size: 0.9rem;
        line-height: 1.7;
      }

      .meta {
        color: #555555;
      }

      .description {
        margin-top: 10px;
        color: #222222;
        font-style: italic;
      }

      .empty-state,
      .error-state {
        color: #555555;
      }
    </style>
  </head>
  <body>
    <main class="container">
      <div class="topbar">
        <a class="back-link" href="index.html">← Back</a>
      </div>
      <h1 id="collection-title"></h1>
      <section id="gallery" class="gallery" aria-live="polite"></section>
    </main>

    <script>
      const gallery = document.getElementById('gallery');
      const collectionId = new URLSearchParams(window.location.search).get('collection');

      fetch('artwork-archive.json')
        .then(response => {
          if (!response.ok) {
            throw new Error('Unable to load artwork archive.');
          }
          return response.json();
        })
        .then(data => {
          const collection = data.collections[collectionId];
          if (!collection) {
            document.title = 'Artwork/Archive | Rafael Yaluff';
            const message = document.createElement('p');
            message.className = 'error-state';
            message.textContent = 'Archive section not found.';
            gallery.appendChild(message);
            return;
          }

          document.title = `${collection.title} | Rafael Yaluff`;
          document.getElementById('collection-title').textContent = collection.title;

          if (collection.artworks.length === 0) {
            const message = document.createElement('p');
            message.className = 'empty-state';
            message.textContent = 'Artwork for this archive will be added soon.';
            gallery.appendChild(message);
            return;
          }

          collection.artworks.forEach(artwork => {
            const card = document.createElement('article');
            card.className = 'artwork';

            const image = document.createElement('img');
            image.src = artwork.image;
            image.alt = artwork.title;
            card.appendChild(image);

            const info = document.createElement('div');
            info.className = 'artwork-info';
            const title = document.createElement('h2');
            title.textContent = artwork.title;
            info.appendChild(title);

            const details = [artwork.year, artwork.medium, artwork.dimensions]
              .filter(Boolean)
              .join(' | ');
            if (details) {
              const meta = document.createElement('p');
              meta.className = 'meta';
              meta.textContent = details;
              info.appendChild(meta);
            }

            if (artwork.description) {
              const description = document.createElement('p');
              description.className = 'description';
              description.textContent = artwork.description;
              info.appendChild(description);
            }

            card.appendChild(info);
            gallery.appendChild(card);
          });
        })
        .catch(error => {
          console.error(error);
          const message = document.createElement('p');
          message.className = 'error-state';
          message.textContent = 'Unable to load this archive section.';
          gallery.appendChild(message);
        });
    </script>
  </body>
</html>
