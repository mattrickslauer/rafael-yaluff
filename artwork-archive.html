<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Artwork/Archive | Rafael Yaluff</title>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
        font-family: Arial, sans-serif;
      }

      body {
        background: #ffffff;
        color: #000000;
        padding: 40px 20px 80px;
      }

      .container {
        max-width: 1200px;
        margin: 0 auto;
      }

      .topbar {
        display: flex;
        align-items: center;
        justify-content: space-between;
        margin-bottom: 32px;
      }

      .lang-switch {
        display: flex;
        gap: 0.25rem;
      }

      .lang-switch button {
        border: 1px solid #000000;
        background: #ffffff;
        color: #000000;
        padding: 6px 14px;
        font-size: 0.85rem;
        letter-spacing: 0.06em;
        cursor: pointer;
      }

      .lang-switch button[aria-pressed="true"] {
        background: #000000;
        color: #ffffff;
      }

      .intro {
        max-width: 760px;
        margin-bottom: 42px;
      }

      .intro h2 {
        font-size: 0.9rem;
        font-weight: 700;
        letter-spacing: 0.12em;
        text-transform: uppercase;
        margin-bottom: 16px;
      }

      .intro span {
        display: block;
        color: #4b4b4b;
        font-size: 0.9rem;
        margin-top: 3px;
        white-space: pre-wrap;
      }

      .back-link {
        color: #000000;
        text-decoration: none;
        font-size: 0.9rem;
      }

      h1 {
        font-size: clamp(2rem, 4vw, 3rem);
        font-weight: 400;
        letter-spacing: 0.08em;
        margin-bottom: 32px;
      }

      .gallery {
        display: grid;
        grid-template-columns: minmax(0, 760px);
        gap: 42px;
      }

      .artwork img {
        display: block;
        width: 100%;
        height: auto;
        background: #f5f5f5;
      }

      .artwork-info {
        margin-top: 16px;
      }

      .artwork-info h2 {
        font-size: 1.1rem;
        margin-bottom: 8px;
      }

      .meta,
      .description,
      .empty-state,
      .error-state {
        font-size: 0.9rem;
        line-height: 1.7;
      }

      .meta {
        color: #555555;
      }

      .description {
        margin-top: 10px;
        color: #222222;
        font-style: italic;
      }

      .empty-state,
      .error-state {
        color: #555555;
      }
    </style>
  </head>
  <body>
    <main class="container">
      <div class="topbar">
        <a class="back-link" href="index.html" id="back-link">← Back</a>
        <div class="lang-switch" role="group" aria-label="Language">
          <button type="button" data-lang="en">English</button>
          <button type="button" data-lang="es">Español</button>
        </div>
      </div>
      <h1 id="collection-title"></h1>
      <div id="intro" class="intro"></div>
      <section id="gallery" class="gallery" aria-live="polite"></section>
    </main>

    <script>
      const gallery = document.getElementById('gallery');
      const intro = document.getElementById('intro');
      const collectionId = new URLSearchParams(window.location.search).get('collection');
      const text = {
        en: {
          back: '← Back',
          empty: 'Artwork for this archive will be added soon.',
          notFound: 'Archive section not found.',
          error: 'Unable to load this archive section.'
        },
        es: {
          back: '← Volver',
          empty: 'Pronto se agregarán obras a este archivo.',
          notFound: 'Sección del archivo no encontrada.',
          error: 'No se pudo cargar esta sección del archivo.'
        }
      };

      let collection = null;
      let state = 'loading';
      let lang = 'en';
      try {
        const saved = localStorage.getItem('archive-lang');
        if (saved === 'en' || saved === 'es') lang = saved;
      } catch (e) {}

      function message(className, content) {
        const p = document.createElement('p');
        p.className = className;
        p.textContent = content;
        return p;
      }

      function render() {
        document.documentElement.lang = lang;
        document.getElementById('back-link').textContent = text[lang].back;
        document.querySelectorAll('.lang-switch button').forEach(button => {
          button.setAttribute('aria-pressed', String(button.dataset.lang === lang));
        });

        intro.replaceChildren();
        const introText = collection && collection.intro ? collection.intro[lang] : '';
        if (introText) {
          const introTitle = collection.introTitle && collection.introTitle[lang];
          if (introTitle) {
            const heading = document.createElement('h2');
            heading.textContent = introTitle;
            intro.appendChild(heading);
          }
          const body = document.createElement('span');
          body.textContent = introText;
          intro.appendChild(body);
        }
        gallery.replaceChildren();

        if (state === 'error' || state === 'notFound') {
          gallery.appendChild(message('error-state', text[lang][state]));
          return;
        }
        if (!collection) return;
        if (collection.artworks.length === 0) {
          gallery.appendChild(message('empty-state', text[lang].empty));
          return;
        }

        collection.artworks.forEach(artwork => {
          const card = document.createElement('article');
          card.className = 'artwork';

          const image = document.createElement('img');
          image.src = artwork.image;
          image.alt = artwork.title[lang];
          card.appendChild(image);

          const info = document.createElement('div');
          info.className = 'artwork-info';
          const title = document.createElement('h2');
          title.textContent = artwork.title[lang];
          info.appendChild(title);

          const meta = document.createElement('p');
          meta.className = 'meta';
          meta.textContent = [artwork.medium[lang], artwork.dimensions[lang], artwork.year[lang]]
            .filter(Boolean)
            .join(' | ');
          info.appendChild(meta);

          card.appendChild(info);
          gallery.appendChild(card);
        });
      }

      document.querySelectorAll('.lang-switch button').forEach(button => {
        button.addEventListener('click', () => {
          lang = button.dataset.lang;
          try { localStorage.setItem('archive-lang', lang); } catch (e) {}
          render();
        });
      });

      fetch('artwork-archive.json')
        .then(response => {
          if (!response.ok) throw new Error('Unable to load artwork archive.');
          return response.json();
        })
        .then(data => {
          collection = data.collections[collectionId] || null;
          if (collection) {
            state = 'ready';
            document.title = `${collection.title} | Rafael Yaluff`;
            document.getElementById('collection-title').textContent = collection.title;
          } else {
            state = 'notFound';
          }
          render();
        })
        .catch(error => {
          console.error(error);
          state = 'error';
          render();
        });

      render();
    </script>
  </body>
</html>
