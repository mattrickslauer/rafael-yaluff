<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Bio & Statement | Rafael Yaluff</title>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
        font-family: Arial, sans-serif;
      }

      body {
        background: #ffffff;
        color: #000000;
        padding: 40px 20px 80px;
      }

      .container {
        max-width: 1000px;
        margin: 0 auto;
      }

      .topbar {
        display: flex;
        align-items: center;
        justify-content: space-between;
        margin-bottom: 32px;
      }

      .back-link {
        color: #000000;
        text-decoration: none;
        font-size: 0.9rem;
      }

      h1 {
        font-size: clamp(2rem, 4vw, 3rem);
        font-weight: 400;
        letter-spacing: 0.08em;
        margin-bottom: 28px;
      }

      .section {
        margin-bottom: 48px;
      }

      .section h2 {
        font-size: 0.9rem;
        font-weight: 700;
        letter-spacing: 0.12em;
        text-transform: uppercase;
        margin-bottom: 16px;
      }

      .paste-area {
        min-height: 180px;
        border: 1px dashed #777;
        padding: 16px;
        line-height: 1.8;
        color: #555;
      }

      a {
        color: #000000;
        text-decoration: none;
      }

      a:hover {
        opacity: 0.6;
      }
    </style>
  </head>
  <body>
    <div class="container">
      <div class="topbar">
        <a class="back-link" href="index.html">← Back</a>
      </div>

      <h1>Bio & Statement</h1>

      <section class="section">
        <h2>Bio</h2>
        <div class="paste-area">
          Paste bio text here.
        </div>
      </section>

      <section class="section">
        <h2>Statement</h2>
        <div class="paste-area">
          Paste statement text here.
        </div>
      </section>
    </div>
  </body>
</html>
