<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title id="painting-title">Painting | Rafael Yaluff</title>
    <link rel="stylesheet" href="styles.css">
    <link rel="shortcut icon" href="images/favicon.jpg" type="image/jpeg">
    <style>
        /* ===== Fullscreen button ===== */
        .fullscreen-btn {
            position: absolute;
            top: 15px;
            right: 15px;
            background: rgba(0, 0, 0, 0.5);
            border: none;
            color: white;
            width: 40px;
            height: 40px;
            border-radius: 50%;
            cursor: pointer;
            display: flex;
            justify-content: center;
            align-items: center;
            transition: background 0.3s ease;
            z-index: 10;
        }
        
        .fullscreen-btn:hover {
            background: rgba(0, 0, 0, 0.8);
        }
        
        .fullscreen-btn svg {
            width: 20px;
            height: 20px;
        }

        /* ===== Painting container: single column ===== */
        .painting-container {
            display: flex;
            flex-direction: column; /* single column */
            align-items: center;    /* center content */
            gap: 20px;
        }

        .painting-image {
            width: 100%;
            max-width: 900px; /* optional max width */
            position: relative;
        }

        .painting-image img {
            width: 100%;
            height: auto;
            display: block;
        }

        .painting-info {
            width: 100%;
            max-width: 900px;
            text-align: center;
        }

        /* ===== Fullscreen view ===== */
        .fullscreen-view {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.9);
            z-index: 1000;
            display: none;
            justify-content: center;
            align-items: center;
            overflow: hidden;
            touch-action: none;
        }
        
        .fullscreen-view.active {
            display: flex;
        }
        
        .fullscreen-view .image-container {
            position: absolute;
            width: 100%;
            height: 100%;
            display: flex;
            justify-content: center;
            align-items: center;
            transform-origin: center;
        }
        
        .fullscreen-view img {
            max-width: 90%;
            max-height: 90%;
            object-fit: contain;
            transform-origin: center;
        }

        /* ===== Exit & Info buttons ===== */
        .exit-fullscreen, .info-fullscreen {
            position: absolute;
            top: 20px;
            background: rgba(255, 255, 255, 0.3);
            border: 2px solid;
            color: inherit;
            font-size: 48px;
            font-weight: bold;
            cursor: pointer;
            z-index: 1001;
            width: 60px;
            height: 60px;
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            line-height: 1;
            box-shadow: 0 0 10px rgba(0, 0, 0, 0.5);
            transition: all 0.2s ease;
        }

        .exit-fullscreen:hover, .info-fullscreen:hover {
            background: rgba(255, 255, 255, 0.5);
            transform: scale(1.1);
        }

        .exit-fullscreen {
            right: 20px;
            border-color: red;
            color: red;
        }

        .info-fullscreen {
            right: 100px;
            top: 20px;
            border-color: blue;
            color: blue;
        }

        /* ===== Info overlay ===== */
        .painting-info-overlay {
            position: fixed;
            bottom: 0;
            left: 0;
            width: 100%;
            background: rgba(0, 0, 0, 0.8);
            color: white;
            padding: 20px;
            transform: translateY(100%);
            transition: transform 0.3s ease;
            z-index: 1002;
            text-align: center;
        }
        
        .painting-info-overlay.active {
            transform: translateY(0);
        }
        
        .painting-info-overlay h2 {
            margin-top: 0;
            font-size: 24px;
        }
        
        .painting-info-overlay p {
            margin: 10px 0;
        }

        /* ===== Responsive adjustments ===== */
        @media (max-width: 768px) {
            .painting-info {
                padding: 0 15px;
            }
        }
    </style>
</head>
<body>
    <div class="wrapper">
        <header>
            <h1><a href="index.html">RAFAEL YALUFF</a></h1>
        </header>
        
        <main class="painting-detail">
            <div class="painting-container">
                <div class="painting-image">
                    <img id="painting-img" src="" alt="">
                    <button class="fullscreen-btn" onclick="openFullscreen()">
                        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="currentColor">
                            <path d="M7 14H5v5h5v-2H7v-3zm-2-4h2V7h3V5H5v5zm12 7h-3v2h5v-5h-2v3zM14 5v2h3v3h2V5h-5z"/>
                        </svg>
                    </button>
                </div>
                <div class="painting-info">
                    <h2 id="painting-title-heading"></h2>
                    <p class="painting-year" id="painting-year"></p>
                    <p class="painting-medium" id="painting-medium"></p>
                    <p class="painting-dimensions" id="painting-dimensions"></p>
                    <div class="painting-description" id="painting-description"></div>
                </div>
            </div>
        </main>
        
        <footer>
            <p>© 2025 Rafael Yaluff. All Rights Reserved.</p>
            <div class="social-links">
                <!-- Social SVG links remain unchanged -->
            </div>
        </footer>
    </div>

    <!-- Fullscreen View -->
    <div class="fullscreen-view" id="fullscreen-view">
        <button class="exit-fullscreen" onclick="closeFullscreen()">×</button>
        <button class="info-fullscreen" onclick="toggleInfoOverlay()">i</button>
        <div class="image-container" id="zoomable-container">
            <img id="fullscreen-img" src="" alt="">
        </div>
        <div class="painting-info-overlay" id="painting-info-overlay">
            <h2 id="overlay-painting-title"></h2>
            <p id="overlay-painting-year"></p>
            <p id="overlay-painting-medium"></p>
            <p id="overlay-painting-dimensions"></p>
            <p id="overlay-painting-description"></p>
        </div>
    </div>

    <script>
        // === Your existing JavaScript remains unchanged ===
        // loadPaintingData, navigatePainting, fullscreen, zoom, overlay, etc.
        // I did not touch it; it works with the new single-column layout
    </script>
</body>
</html>
