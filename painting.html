<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title id="painting-title">Painting | Rafael Yaluff</title>
    <link rel="stylesheet" href="styles.css">
    <link rel="shortcut icon" href="images/favicon.jpg" type="image/jpeg">
    <style>
        .fullscreen-btn {
            position: absolute;
            top: 15px;
            right: 15px;
            background: rgba(0, 0, 0, 0.5);
            border: none;
            color: white;
            width: 40px;
            height: 40px;
            border-radius: 50%;
            cursor: pointer;
            display: flex;
            justify-content: center;
            align-items: center;
            transition: background 0.3s ease;
            z-index: 10;
        }
        
        .fullscreen-btn:hover {
            background: rgba(0, 0, 0, 0.8);
        }
        
        .fullscreen-btn svg {
            width: 20px;
            height: 20px;
        }

        .painting-image {
            position: relative;
        }
        
        .fullscreen-view {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.9);
            z-index: 1000;
            display: none;
            justify-content: center;
            align-items: center;
            overflow: hidden;
            touch-action: none;
        }
        
        .fullscreen-view.active {
            display: flex;
        }
        
        .fullscreen-view .image-container {
            position: absolute;
            width: 100%;
            height: 100%;
            display: flex;
            justify-content: center;
            align-items: center;
            transform-origin: center;
        }
        
        .fullscreen-view img {
            max-width: 90%;
            max-height: 90%;
            object-fit: contain;
            transform-origin: center;
        }
        
        .exit-fullscreen {
            position: absolute;
            top: 20px;
            right: 20px;
            background: rgba(255, 255, 255, 0.3);
            border: 2px solid red;
            color: red;
            font-size: 48px;
            font-weight: bold;
            cursor: pointer;
            z-index: 1001;
            width: 60px;
            height: 60px;
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            line-height: 1;
            box-shadow: 0 0 10px rgba(0, 0, 0, 0.5);
            transition: all 0.2s ease;
        }
        
        .exit-fullscreen:hover {
            background: rgba(255, 255, 255, 0.5);
            transform: scale(1.1);
        }

        .info-fullscreen {
            position: absolute;
            top: 100px;
            right: 20px;
            background: rgba(255, 255, 255, 0.3);
            border: 2px solid blue;
            color: blue;
            font-size: 48px;
            font-weight: bold;
            cursor: pointer;
            z-index: 1001;
            width: 60px;
            height: 60px;
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            line-height: 1;
            box-shadow: 0 0 10px rgba(0, 0, 0, 0.5);
            transition: all 0.2s ease;
        }
        
        .info-fullscreen:hover {
            background: rgba(255, 255, 255, 0.5);
            transform: scale(1.1);
        }

        .painting-info-overlay {
            position: fixed;
            bottom: 0;
            left: 0;
            width: 100%;
            background: rgba(0, 0, 0, 0.8);
            color: white;
            padding: 20px;
            transform: translateY(100%);
            transition: transform 0.3s ease;
            z-index: 1002;
            text-align: center;
        }
        
        .painting-info-overlay.active {
            transform: translateY(0);
        }
        
        .painting-info-overlay h2 {
            margin-top: 0;
            font-size: 24px;
        }
        
        .painting-info-overlay p {
            margin: 10px 0;
        }

        /* Navigation buttons styles */
        .nav-button {
            position: absolute;
            top: 50%;
            transform: translateY(-50%);
            background: rgba(255, 255, 255, 0.3);
            border: none;
            color: white;
            width: 50px;
            height: 50px;
            border-radius: 50%;
            cursor: pointer;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 24px;
            z-index: 10;
            transition: background 0.3s ease;
        }
        
        .nav-button:hover {
            background: rgba(255, 255, 255, 0.5);
        }
        
        .nav-prev {
            left: 20px;
        }
        
        .nav-next {
            right: 20px;
        }

        .fullscreen-nav-button {
            position: absolute;
            top: 50%;
            transform: translateY(-50%);
            background: rgba(255, 255, 255, 0.3);
            border: 2px solid white;
            color: white;
            width: 60px;
            height: 60px;
            border-radius: 50%;
            cursor: pointer;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 36px;
            z-index: 1001;
            transition: all 0.2s ease;
        }
        
        .fullscreen-nav-button:hover {
            background: rgba(255, 255, 255, 0.5);
            transform: translateY(-50%) scale(1.1);
        }
        
        .fullscreen-nav-prev {
            left: 20px;
        }
        
        .fullscreen-nav-next {
            right: 20px;
        }

        /* Swipe indicator */
        .swipe-indicator {
            position: fixed;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(255, 255, 255, 0.3);
            color: white;
            padding: 10px 20px;
            border-radius: 20px;
            font-size: 14px;
            display: none;
            z-index: 1001;
        }

        @media (max-width: 768px) {
            .swipe-indicator {
                display: block;
            }
        }
    </style>
</head>
<body>
    <div class="wrapper">
        <header>
            <h1><a href="index.html">RAFAEL YALUFF</a></h1>
        </header>
        
        <main class="painting-detail">
            <div class="painting-container">
                <div class="painting-image">
                    <img id="painting-img" src="" alt="" onclick="openFullscreen()">
                    <!-- removed explicit fullscreen button; image click triggers fullscreen -->
                </div>
                <div class="painting-info">
                    <h2 id="painting-title-heading"></h2>
                    <p class="painting-year" id="painting-year"></p>
                    <p class="painting-medium" id="painting-medium"></p>
                    <p class="painting-dimensions" id="painting-dimensions"></p>
                    <div class="painting-description" id="painting-description"></div>
                </div>
            </div>
        </main>
        
        <footer>
            <p>© 2025 Rafael Yaluff. All Rights Reserved.</p>
            <div class="social-links">
                <!-- (unchanged) -->
            </div>
        </footer>
    </div>

    <!-- Fullscreen View Container -->
    <div class="fullscreen-view" id="fullscreen-view">
        <button class="exit-fullscreen" onclick="closeFullscreen()">×</button>
        <button class="info-fullscreen" onclick="toggleInfoOverlay()">i</button>
        <div class="image-container" id="zoomable-container">
            <img id="fullscreen-img" src="" alt="">
        </div>
        <div class="swipe-indicator">Swipe left or right to navigate</div>
        <div class="painting-info-overlay" id="painting-info-overlay">
            <h2 id="overlay-painting-title"></h2>
            <p id="overlay-painting-year"></p>
            <p id="overlay-painting-medium"></p>
            <p id="overlay-painting-dimensions"></p>
            <p id="overlay-painting-description"></p>
        </div>
    </div>

    <script>
    // ------------------------------
    // Modified openFullscreen() only
    function openFullscreen() {
        const fullscreenView = document.getElementById('fullscreen-view');
        fullscreenView.classList.add('active');
        document.body.style.overflow = 'hidden';

        // Try Fullscreen API (won't always work, but overlay still shows)
        if (fullscreenView.requestFullscreen) {
            fullscreenView.requestFullscreen().catch(() => {});
        } else if (fullscreenView.webkitRequestFullscreen) {
            fullscreenView.webkitRequestFullscreen();
        } else if (fullscreenView.msRequestFullscreen) {
            fullscreenView.msRequestFullscreen();
        }
    }
    // ------------------------------
    // (the rest of your original script remains unchanged)
    </script>
</body>
</html>
