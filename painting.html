<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title id="painting-title">Painting | Rafael Yaluff</title>
    <link rel="stylesheet" href="styles.css">
    <style>
        /* make fullscreen view always cover viewport */
        .fullscreen-view {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background: rgba(0, 0, 0, 0.9);
            z-index: 1000;
            display: none;
            justify-content: center;
            align-items: center;
            overflow: hidden;
        }
        .fullscreen-view.active {
            display: flex !important;
        }

        /* center the image inside it */
        .fullscreen-view .image-container {
            width: 100%;
            height: 100%;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        .fullscreen-view img {
            max-width: 90%;
            max-height: 90%;
            object-fit: contain;
        }

        /* exit button */
        .exit-fullscreen {
            position: absolute;
            top: 20px;
            right: 20px;
            background: rgba(255, 255, 255, 0.3);
            border: 2px solid red;
            color: red;
            font-size: 48px;
            cursor: pointer;
            width: 60px;
            height: 60px;
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 1001;
        }
    </style>
</head>
<body>
    <div class="wrapper">
        <header><h1><a href="index.html">RAFAEL YALUFF</a></h1></header>
        
        <main class="painting-detail">
            <div class="painting-container">
                <div class="painting-image">
                    <!-- clicking the image opens the fullscreen overlay -->
                    <img id="painting-img" src="" alt="" onclick="openFullscreenOverlay()">
                </div>
                <div class="painting-info">
                    <h2 id="painting-title-heading"></h2>
                    <p id="painting-year"></p>
                    <p id="painting-medium"></p>
                    <p id="painting-dimensions"></p>
                    <div id="painting-description"></div>
                </div>
            </div>
        </main>
        
        <footer>
            <p>© 2025 Rafael Yaluff. All Rights Reserved.</p>
        </footer>
    </div>

    <!-- fullscreen CSS overlay -->
    <div class="fullscreen-view" id="fullscreen-view">
        <button class="exit-fullscreen" onclick="closeFullscreenOverlay()">×</button>
        <div class="image-container" id="zoomable-container">
            <img id="fullscreen-img" src="" alt="">
        </div>
    </div>

    <script>
    let allPaintings = [];
    let currentPaintingIndex = 0;

    function getPaintingId() {
        const urlParams = new URLSearchParams(window.location.search);
        return urlParams.get('id');
    }

    function loadPaintingData() {
        const paintingId = getPaintingId();
        fetch('paintings.json')
            .then(response => response.json())
            .then(data => {
                allPaintings = data.paintings;
                currentPaintingIndex = allPaintings.findIndex(p => p.id === paintingId);
                if (currentPaintingIndex === -1) currentPaintingIndex = 0;
                displayCurrentPainting();
            });
    }

    function displayCurrentPainting() {
        const painting = allPaintings[currentPaintingIndex];
        document.title = `${painting.title} | Rafael Yaluff`;
        document.getElementById('painting-title-heading').textContent = painting.title;
        document.getElementById('painting-year').textContent = painting.year;
        document.getElementById('painting-medium').textContent = painting.medium;
        document.getElementById('painting-dimensions').textContent = painting.dimensions;
        document.getElementById('painting-description').textContent = painting.description;
        document.getElementById('painting-img').src = painting.image;
        document.getElementById('painting-img').alt = painting.title;
        document.getElementById('fullscreen-img').src = painting.image;
        document.getElementById('fullscreen-img').alt = painting.title;
    }

    function openFullscreenOverlay() {
        document.getElementById('fullscreen-view').classList.add('active');
    }

    function closeFullscreenOverlay() {
        document.getElementById('fullscreen-view').classList.remove('active');
    }

    window.addEventListener('DOMContentLoaded', loadPaintingData);
    </script>
</body>
</html>
