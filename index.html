<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Rafael Yaluff</title>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
        font-family: Arial, sans-serif;
      }

      html, body {
        height: 100%;
        background: #ffffff;
        color: #000000;
      }

      body {
        display: flex;
        align-items: center;
        justify-content: center;
      }

      .site {
        width: min(90vw, 900px);
      }

      h1 {
        text-align: center;
        font-size: clamp(2rem, 4vw, 4rem);
        font-weight: 400;
        letter-spacing: 0.08em;
        margin: 0 0 2.5rem 0;
        line-height: 1.1;
      }

      .nav {
        display: flex;
        align-items: center;
        justify-content: space-between;
        width: min(100%, 420px);
        margin: 0 auto;
      }

      .nav a {
        color: #000000;
        text-decoration: none;
        font-size: clamp(1rem, 2vw, 1.8rem);
        letter-spacing: 0.04em;
        transition: opacity 0.2s ease;
      }

      .nav a:hover {
        opacity: 0.6;
      }

      @media (max-width: 640px) {
        .nav {
          width: 100%;
          gap: 1rem;
        }
      }
    </style>
  </head>
  <body>
    <div class="site">
      <h1>Rafael Yaluff</h1>
      <div class="nav" aria-label="Main navigation">
        <a href="paintings.html">Paintings</a>
        <a href="cv.html">CV</a>
      </div>
    </div>
  </body>
</html>
