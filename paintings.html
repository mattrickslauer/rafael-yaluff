<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Paintings | Rafael Yaluff</title>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
        font-family: Arial, sans-serif;
      }

      body {
        background: #ffffff;
        color: #000000;
        padding: 40px 20px 80px;
      }

      .container {
        max-width: 1200px;
        margin: 0 auto;
      }

      .topbar {
        display: flex;
        align-items: center;
        justify-content: space-between;
        margin-bottom: 32px;
      }

      .back-link {
        color: #000000;
        text-decoration: none;
        font-size: 0.9rem;
      }

      h1 {
        text-align: left;
        font-size: clamp(1.5rem, 2.2vw, 2.3rem);
        font-weight: 400;
        letter-spacing: 0.08em;
        margin: 0 0 32px 0;
      }

      .gallery {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(320px, 1fr));
        gap: 42px;
      }

      .painting {
        display: flex;
        flex-direction: column;
      }

      .painting img {
        width: 100%;
        height: auto;
        display: block;
        background: #f5f5f5;
        cursor: pointer;
      }

      .painting-info {
        margin-top: 16px;
      }

      .painting-info h2 {
        font-size: 1.1rem;
        font-weight: 700;
        margin-bottom: 8px;
        letter-spacing: 0.04em;
      }

      .meta {
        font-size: 0.82rem;
        color: #555555;
        line-height: 1.6;
        margin-bottom: 10px;
      }

      .description {
        font-size: 0.9rem;
        line-height: 1.7;
        color: #222222;
        font-style: italic;
      }

      .lightbox {
        position: fixed;
        inset: 0;
        display: none;
        align-items: center;
        justify-content: center;
        background: rgba(0, 0, 0, 0.8);
        z-index: 999;
        padding: 32px;
      }

      .lightbox.open {
        display: flex;
      }

      .lightbox-content {
        position: relative;
        max-width: min(90vw, 1200px);
        max-height: 90vh;
      }

      .lightbox-content img {
        display: block;
        max-width: 100%;
        max-height: 90vh;
        width: auto;
        height: auto;
        background: #ffffff;
      }

      .lightbox-close {
        position: absolute;
        top: -16px;
        right: -16px;
        width: 36px;
        height: 36px;
        border: none;
        border-radius: 50%;
        background: #ffffff;
        color: #000000;
        font-size: 1.2rem;
        cursor: pointer;
      }

      @media (max-width: 640px) {
        .gallery {
          grid-template-columns: 1fr;
        }

        .lightbox {
          padding: 20px;
        }
      }
    </style>
  </head>
  <body>
    <div class="container">
      <div class="topbar">
        <a class="back-link" href="index.html">← Back</a>
      </div>
      <h1>Paintings</h1>
      <div id="gallery" class="gallery"></div>
    </div>

    <div id="lightbox" class="lightbox" aria-hidden="true">
      <div class="lightbox-content">
        <button class="lightbox-close" aria-label="Close image">×</button>
        <img id="lightbox-image" src="" alt="Expanded painting view" />
      </div>
    </div>

    <script>
      fetch('paintings.json')
        .then(res => res.json())
        .then(data => {
          const gallery = document.getElementById('gallery');
          const lightbox = document.getElementById('lightbox');
          const lightboxImage = document.getElementById('lightbox-image');
          const closeButton = document.querySelector('.lightbox-close');

          data.paintings.forEach((painting) => {
            const card = document.createElement('article');
            card.className = 'painting';
            const description = painting.description && painting.description.trim()
              ? `<div class="description">${painting.description}</div>`
              : '';

            card.innerHTML = `
              <img src="${painting.image}" alt="${painting.title}" data-title="${painting.title}" />
              <div class="painting-info">
                <h2>${painting.title}</h2>
                <div class="meta">${painting.year} | ${painting.medium}<br>${painting.dimensions}</div>
                ${description}
              </div>
            `;

            const image = card.querySelector('img');
            image.addEventListener('click', () => {
              lightboxImage.src = painting.image;
              lightboxImage.alt = painting.title;
              lightbox.classList.add('open');
              lightbox.setAttribute('aria-hidden', 'false');
            });

            gallery.appendChild(card);
          });

          function closeLightbox() {
            lightbox.classList.remove('open');
            lightbox.setAttribute('aria-hidden', 'true');
            lightboxImage.src = '';
          }

          closeButton.addEventListener('click', closeLightbox);

          lightbox.addEventListener('click', (event) => {
            if (event.target === lightbox) {
              closeLightbox();
            }
          });

          document.addEventListener('keydown', (event) => {
            if (event.key === 'Escape' && lightbox.classList.contains('open')) {
              closeLightbox();
            }
          });
        })
        .catch(() => {
          document.getElementById('gallery').innerHTML = '<p>Unable to load paintings.</p>';
        });
    </script>
  </body>
</html>
