<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Paintings | Rafael Yaluff</title>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
        font-family: Arial, sans-serif;
      }

      body {
        background: #ffffff;
        color: #000000;
        padding: 40px 20px 80px;
      }

      .container {
        max-width: 1200px;
        margin: 0 auto;
      }

      .topbar {
        display: flex;
        align-items: center;
        justify-content: space-between;
        margin-bottom: 32px;
      }

      .back-link {
        color: #000000;
        text-decoration: none;
        font-size: 0.9rem;
      }

      h1 {
        text-align: center;
        font-size: clamp(2rem, 4vw, 3rem);
        font-weight: 400;
        letter-spacing: 0.08em;
        margin-bottom: 48px;
      }

      .gallery {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(320px, 1fr));
        gap: 42px;
      }

      .painting {
        display: flex;
        flex-direction: column;
      }

      .painting img {
        width: 100%;
        height: auto;
        display: block;
        background: #f5f5f5;
      }

      .painting-info {
        margin-top: 16px;
      }

      .painting-info h2 {
        font-size: 0.85rem;
        font-weight: 700;
        margin: 0 0 4px 0;
        letter-spacing: 0.04em;
        line-height: 1.3;
      }

      .meta {
        font-size: 0.82rem;
        color: #555555;
        line-height: 1.6;
        margin: 0 0 0 0;
      }

      .description {
        font-size: 0.9rem;
        line-height: 1.7;
        color: #222222;
        font-style: italic;
      }

      @media (max-width: 640px) {
        .gallery {
          grid-template-columns: 1fr;
        }
      }
    </style>
  </head>
  <body>
    <div class="container">
      <div class="topbar">
        <a class="back-link" href="index.html">← Back</a>
      </div>
      <h1>Paintings</h1>
      <div id="gallery" class="gallery"></div>
    </div>

    <script>
      fetch('paintings.json')
        .then(res => res.json())
        .then(data => {
          const gallery = document.getElementById('gallery');
          data.paintings.forEach((painting) => {
            const card = document.createElement('article');
            card.className = 'painting';
            const description = painting.description && painting.description.trim()
              ? `<div class="description">${painting.description}</div>`
              : '';

            card.innerHTML = `
              <img src="${painting.image}" alt="${painting.title}" />
              <div class="painting-info">
                <h2>${painting.title}</h2>
                <div class="meta">${painting.year} | ${painting.medium}<br>${painting.dimensions}</div>
                ${description}
              </div>
            `;
            gallery.appendChild(card);
          });
        })
        .catch(() => {
          document.getElementById('gallery').innerHTML = '<p>Unable to load paintings.</p>';
        });
    </script>
  </body>
</html>
